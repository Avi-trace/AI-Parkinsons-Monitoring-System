name: CI

on:
  push:
    branches: [main, sana-hand-tracking]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github backend tests
      - name: Tests (synthetic-signal regression suite + API)
        run: pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Lint (non-blocking until the frontend rework)
        run: npx eslint . -f json | node scripts/eslint-annotate.mjs
        continue-on-error: true
